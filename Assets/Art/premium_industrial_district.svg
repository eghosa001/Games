<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#071319"/><stop offset=".55" stop-color="#0b1c24"/><stop offset="1" stop-color="#123039"/></linearGradient>
 <linearGradient id="ground" x2="0" y2="1"><stop stop-color="#10242a"/><stop offset="1" stop-color="#071116"/></linearGradient>
 <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#9bc6bd" stop-opacity=".72"/><stop offset="1" stop-color="#37666b" stop-opacity=".35"/></linearGradient>
 <linearGradient id="metal" x2="1" y2="1"><stop stop-color="#294750"/><stop offset="1" stop-color="#142c34"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
