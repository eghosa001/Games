name: RENEW Final Godot Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted parse repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def edit(path, fn):
              p = Path(path)
              if not p.exists():
                  return
              s = p.read_text()
              n = fn(s)
              if n != s:
                  p.write_text(n)

          def direct(path, pairs):
              edit(path, lambda s: __import__('functools').reduce(lambda x, pair: x.replace(*pair), pairs, s))

          direct('scripts/business_system.gd', [
              ('func _technology() -> Node:\n    return get_node_or_null("/root/RenewTechnologySystem")', 'func _technology() -> Variant:\n    return get_node_or_null("/root/RenewTechnologySystem")'),
              ('func _technology():return get_node_or_null("/root/RenewTechnologySystem")', 'func _technology() -> Variant:\n    return get_node_or_null("/root/RenewTechnologySystem")'),
              ('func get_industries()->Array:\n    var result:Array=[];for key in INDUSTRIES.keys():result.append(INDUSTRIES[key].duplicate(true));return result', 'func get_industries() -> Array:\n    var result: Array = []\n    for key in INDUSTRIES.keys():\n        result.append(INDUSTRIES[key].duplicate(true))\n    return result'),
              ('func get_industry(industry_id:String)->Dictionary:return INDUSTRIES.get(industry_id,{}).duplicate(true)', 'func get_industry(industry_id: String) -> Dictionary:\n    return INDUSTRIES.get(industry_id, {}).duplicate(true)'),
              ('func get_business_purposes()->Array:return PURPOSES.get(_origin_property_type(),[]).duplicate(true)', 'func get_business_purposes() -> Array:\n    var result = PURPOSES.get(_origin_property_type(), [])\n    if result is Array:\n        return result.duplicate(true)\n    return []'),
              ('func get_business_purpose(index:int)->Dictionary:\n    var choices:=get_business_purposes();if index<0 or index>=choices.size():return {};return choices[index].duplicate(true)', 'func get_business_purpose(index: int) -> Dictionary:\n    var choices: Array = get_business_purposes()\n    if index < 0 or index >= choices.size():\n        return {}\n    return choices[index].duplicate(true)'),
          ])

          direct('scripts/simulation_system.gd', [
              ('func end_day(args: Dictionary = {}) -> Dictionary:\n    var finance = _finance(); if finance == null: return {"ok": false, "message": "FinanceSystem is unavailable."}\n    var debt_result: Dictionary = finance.settle_debt_day(); var economy = _economy(); if economy != null: economy.end_market_day(); last_result = debt_result; return debt_result', 'func end_day(args: Dictionary = {}) -> Dictionary:\n    var finance = _finance()\n    if finance == null:\n        return {"ok": false, "message": "FinanceSystem is unavailable."}\n    var debt_result: Dictionary = finance.settle_debt_day()\n    var economy = _economy()\n    if economy != null:\n        economy.end_market_day()\n    last_result = debt_result\n    return debt_result'),
          ])

          direct('scripts/news_system.gd', [
              ('func get_archive(limit:int=30)->Array[Dictionary]:\n    var result:Array[Dictionary]=[];var start:=max(0,archive.size()-max(1,limit));for i in range(archive.size()-1,start-1,-1):result.append(archive[i].duplicate(true));return result', 'func get_archive(limit: int = 30) -> Array[Dictionary]:\n    var result: Array[Dictionary] = []\n    var start: int = max(0, archive.size() - max(1, limit))\n    for i in range(archive.size() - 1, start - 1, -1):\n        result.append(archive[i].duplicate(true))\n    return result'),
              ('func _main() -> Node:', 'func _main() -> Variant:'),
          ])

          direct('scripts/supply_chain_system.gd', [
              ('func _transport_capacity(level:int)->float:\n    var base: float = 40.0+float(max(0,level-1))*20.0;var tech=_technology()\n    return base*tech.transport_capacity_multiplier() if tech!=null else base', 'func _transport_capacity(level: int) -> float:\n    var base: float = 40.0 + float(max(0, level - 1)) * 20.0\n    var tech = _technology()\n    if tech != null:\n        return base * tech.transport_capacity_multiplier()\n    return base'),
              ('func _freight_cost(resource:String,amount:float,level:int)->int:\n    var distance_factor:=1.0\n    if economy!=null and economy.resources.has(resource):distance_factor=1.0+float(str(economy.resources[resource].get("region","Unknown")).length()%4)*0.05\n    var base_cost:=amount*(2.0+float(max(0,3-level)))*distance_factor\n    var effects:=_railway_effects();return int(round(base_cost*float(effects.get("transport_cost_multiplier",1.0))))', 'func _freight_cost(resource: String, amount: float, level: int) -> int:\n    var distance_factor: float = 1.0\n    if economy != null and economy.resources.has(resource):\n        distance_factor = 1.0 + float(str(economy.resources[resource].get("region", "Unknown")).length() % 4) * 0.05\n    var base_cost: float = amount * (2.0 + float(max(0, 3 - level))) * distance_factor\n    var effects: Dictionary = _railway_effects()\n    var multiplier: float = float(effects.get("transport_cost_multiplier", 1.0))\n    return int(round(base_cost * multiplier))'),
          ])

          # Keep Godot 4.7 from seeing the reserved identifier `next` even if
          # an older compatibility transform reintroduced it.
          edit('scripts/economic_cycle_system.gd', lambda s: re.sub(r'\bvar next\s*:\s*Variant\s*=\s*phase', 'var next_phase: Variant = phase', s).replace('next = OVERHEATING', 'next_phase = OVERHEATING').replace('next = BOOM', 'next_phase = BOOM').replace('next = RECESSION', 'next_phase = RECESSION').replace('next = RECOVERY', 'next_phase = RECOVERY').replace('next = EXPANSION', 'next_phase = EXPANSION').replace('next != phase', 'next_phase != phase').replace('phase = next;', 'phase = next_phase;'))
          PY
      - name: Commit repairs
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts
            git commit -m "Fix remaining Godot 4.7 parse paths [skip ci]"
            git push
          fi