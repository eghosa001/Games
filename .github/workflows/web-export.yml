name: Godot Web Export

on:
  workflow_run:
    workflows: ["RENEW Godot Tests"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: renew-web-production
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  export-and-deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y unzip wget

      - name: Install Godot
        run: |
          set -euo pipefail
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"

      - name: Install matching export templates
        run: |
          set -euo pipefail
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O /tmp/templates.tpz
          unzip -q -j /tmp/templates.tpz 'templates/*' -d "$templates"
          printf '%s\n' "${GODOT_VERSION}.stable" > "$templates/version.txt"

      - name: Import untouched project
        run: timeout 120s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --editor --path . --quit

      - name: Re-run critical release gates
        run: |
          set -euo pipefail
          timeout 180s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --script res://tests/test_release_smoke.gd
          timeout 300s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --script res://tests/test_new_game_flow.gd
          git diff --exit-code

      - name: Export Web release
        run: |
          set -euo pipefail
          mkdir -p build/web
          timeout 600s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.html
          test -n "$(find build/web -maxdepth 1 -name '*.wasm' -print -quit)"
          test -n "$(find build/web -maxdepth 1 -name '*.pck' -print -quit)"

      - name: Verify single-threaded Web configuration
        run: |
          set -euo pipefail
          grep -q 'variant/thread_support=false' export_presets.cfg
          if grep -R -q 'SharedArrayBuffer' build/web; then
            echo "ERROR: single-threaded export unexpectedly references SharedArrayBuffer"
            exit 1
          fi

      - name: Verify source stayed clean
        run: git diff --exit-code

      - name: Deploy validated build to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true
