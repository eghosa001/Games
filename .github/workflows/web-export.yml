name: Godot Web Export

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2
  GODOT_TEMPLATE_VERSION: 4.7.2.stable

jobs:
  export-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot export templates
        shell: bash
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="${XDG_DATA_HOME:-${HOME}/.local/share}"
          TEMPLATES_DIR="$XDG_DATA_HOME/godot/export_templates/$GODOT_TEMPLATE_VERSION"
          mkdir -p "$TEMPLATES_DIR" /tmp/godot_templates
          wget -q --tries=5 --waitretry=3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O /tmp/templates.tpz
          test -s /tmp/templates.tpz
          7z x /tmp/templates.tpz -o/tmp/godot_templates >/dev/null
          for template in web_nothreads_debug.zip web_nothreads_release.zip; do
            source_file="$(find /tmp/godot_templates -type f -name "$template" -print -quit)"
            test -n "$source_file"
            cp -f "$source_file" "$TEMPLATES_DIR/$template"
          done
          version_file="$(find /tmp/godot_templates -type f -name version.txt -print -quit || true)"
          [ -z "$version_file" ] || cp -f "$version_file" "$TEMPLATES_DIR/version.txt"
          for template in web_nothreads_debug.zip web_nothreads_release.zip; do
            test -s "$TEMPLATES_DIR/$template"
          done

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          wget -q --tries=5 --waitretry=3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          rm -rf "$HOME/godot"
          mkdir -p "$HOME/godot"
          7z x /tmp/godot.zip -o"$HOME/godot" >/dev/null
          chmod +x "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" --version

      - name: Validate project before export
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --editor --path . --quit

      - name: Run release smoke gate
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --script res://tests/release/test_release_smoke.gd
          timeout 180s "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --script res://tests/release/test_full_new_game_flow.gd

      - name: Export Web build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/web
          mkdir -p build/web
          timeout 600s "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.html

      - name: Verify single-threaded Web export
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'GODOT_THREADS_ENABLED = false' build/web/index.html
          if grep -q 'GODOT_THREADS_ENABLED = true' build/web/index.html; then
            echo 'ERROR: Web export still has thread support enabled.'
            exit 1
          fi
          echo 'Verified: Web export is single-threaded.'

      - name: Add static-hosting headers file
        shell: bash
        run: |
          set -euo pipefail
          cat > build/web/_headers <<'EOF'
          /*
            Cross-Origin-Opener-Policy: same-origin
            Cross-Origin-Embedder-Policy: require-corp
            Cross-Origin-Resource-Policy: cross-origin
          EOF

      - name: Publish Web build to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./build/web
          force_orphan: true
