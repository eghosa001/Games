name: Hosted Runner Smoke Test

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Runner allocated
        run: |
          echo "Runner: $RUNNER_NAME"
          echo "OS: $RUNNER_OS"
          echo "Hosted runner smoke test passed."
