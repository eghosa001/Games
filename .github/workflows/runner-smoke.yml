name: Hosted Runner Smoke Test

on:
  push:
    branches:
      - diagnostic/hosted-runner-smoke
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Runner allocated
        run: |
          echo "Runner: $RUNNER_NAME"
          echo "OS: $RUNNER_OS"
          echo "Hosted runner smoke test passed."
