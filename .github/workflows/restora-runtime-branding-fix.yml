name: Restora Runtime Branding Fix

on:
  push:
    branches: [fix/restora-runtime-branding]
    paths:
      - '.github/workflows/restora-runtime-branding-fix.yml'

permissions:
  contents: write

jobs:
  apply-runtime-branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restora-runtime-branding
          fetch-depth: 0
      - name: Apply compatibility-safe player-facing replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'scripts/alliance_ui.gd': [
                  ('RENEW Restoration Consortium', 'RESTORA Restoration Consortium'),
              ],
              'scripts/business_system.gd': [
                  ('RENEW Goods', 'Restora Goods'),
                  ('Choose what this restored property will become: press 4, 5 or 6.', 'Choose what this restored property will become from the business choices.'),
                  ('Choose a business purpose first: press 4, 5 or 6.', 'Choose a business purpose first from the available business choices.'),
              ],
              'scripts/contract_command_system.gd': [
                  ('RENEW Goods', 'Restora Goods'),
              ],
              'scripts/contract_system.gd': [
                  ('RENEW Goods', 'Restora Goods'),
              ],
              'scripts/corporate.gd': [
                  ('RENEW Empire', 'RESTORA Empire'),
                  ('RENEW Co. is already listed.', 'RESTORA Co. is already listed.'),
              ],
              'scripts/premium_ui_skin.gd': [
                  ('RENEW // EXECUTIVE NETWORK', 'RESTORA // EXECUTIVE NETWORK'),
                  ('text_upper.begins_with("RENEW")', '(text_upper.begins_with("RESTORA") or text_upper.begins_with("RENEW"))'),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {filename}: {old}')
                  text = text.replace(old, new)
              path.write_text(text)

          # The workflow is intentionally one-shot and removes itself from the branch.
          Path('.github/workflows/restora-runtime-branding-fix.yml').unlink()
          PY
          git diff --check
          git diff -- scripts .github/workflows/restora-runtime-branding-fix.yml
      - name: Commit fixes to branch
        shell: bash
        run: |
          git config user.name 'Restora Maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts .github/workflows/restora-runtime-branding-fix.yml
          git commit -m 'finish Restora runtime branding and mobile business prompts'
          git push origin HEAD:fix/restora-runtime-branding
