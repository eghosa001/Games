name: RESTORA Figma Visual Parity

on:
  pull_request:
    paths:
      - 'scripts/restora_command_ui.gd'
      - 'scripts/theme_manager.gd'
      - 'scripts/premium_ui_skin.gd'
      - 'scripts/*_ui.gd'
      - 'scenes/Main.tscn'
      - 'tests/capture_visual_audit.gd'
      - '.github/workflows/figma-visual-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restora-figma-parity-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  visual-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y unzip curl xvfb

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 3             "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"             -o /tmp/godot.zip
          unzip -q /tmp/godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --version

      - name: Import project
        run: timeout 180s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --editor --path . --quit

      - name: Capture all RESTORA screens
        run: |
          rm -rf artifacts/visual-audit
          timeout 900s xvfb-run -a "./Godot_v${GODOT_VERSION}-stable_linux.x86_64"             --path . --script res://tests/capture_visual_audit.gd

      - name: Verify screenshot set
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/visual-audit/manifest.txt
          count=$(find artifacts/visual-audit -maxdepth 1 -name '*.png' | wc -l)
          echo "Captured $count parity screenshots"
          test "$count" -eq 77

      - name: Upload parity screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: restora-figma-parity
          path: artifacts/visual-audit/
          if-no-files-found: error
          retention-days: 14
