name: RESTORA Accessibility Quality APK 20261008

on:
  push:
    branches:
      - build/restora-accessibility-2cccdff-20261008

permissions:
  contents: read

concurrency:
  group: restora-one-off-apk-2cccdff
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  ANDROID_CMDLINE_TOOLS: 15859902

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-$HOME/android-sdk}"
          mkdir -p "$sdk_root/cmdline-tools"
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CMDLINE_TOOLS}_latest.zip" -O /tmp/android-tools.zip
          rm -rf /tmp/android-tools && mkdir -p /tmp/android-tools
          unzip -q /tmp/android-tools.zip -d /tmp/android-tools
          rm -rf "$sdk_root/cmdline-tools/latest"
          mv /tmp/android-tools/cmdline-tools "$sdk_root/cmdline-tools/latest"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" --licenses >/dev/null || true
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" 'templates/*' -d "$templates"
          rm -rf android/build && mkdir -p android/build
          unzip -q "$templates/android_source.zip" -d android/build

      - name: Import project
        run: timeout 180s ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Validate Android export configuration
        run: timeout 120s ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --script res://tests/test_android_release_config.gd

      - name: Export debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          timeout 600s ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --export-debug "Android" build/Restora-debug.apk
          test -s build/Restora-debug.apk
          sha256sum build/Restora-debug.apk | tee build/Restora-debug.apk.sha256
          ls -lh build/Restora-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Restora-Android-debug-2cccdff
          path: |
            build/Restora-debug.apk
            build/Restora-debug.apk.sha256
          retention-days: 14
