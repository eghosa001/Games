name: One Pass Production Repair

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply production repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def edit(path, fn):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = fn(s)
              if n != s:
                  p.write_text(n, encoding='utf-8')
                  print('UPDATED', path)
              else:
                  print('UNCHANGED', path)

          # Godot 4.7 requires explicit types where values originate from Variant-returning APIs.
          replacements = {
              'scripts/alliance_ui.gd': [
                  ('var partner_y := y + ceil(float(buttons.size()) / float(cols)) * 50 + 4', 'var partner_y: float = y + ceil(float(buttons.size()) / float(cols)) * 50 + 4'),
              ],
              'scripts/headquarters_ui.gd': [
                  ('var stage_index := system.get_stage_index()', 'var stage_index: int = int(system.get_stage_index())'),
                  ('var built := system.has_area(selected_area)', 'var built: bool = bool(system.has_area(selected_area))'),
                  ('var level := system.area_level(selected_area)', 'var level: int = int(system.area_level(selected_area))'),
                  ('var unlocked := stage_index >= int(spec.get("min_stage", 0))', 'var unlocked: bool = stage_index >= int(spec.get("min_stage", 0))'),
              ],
              'scripts/infrastructure_ui.gd': [
                  ('var game := _parent()', 'var game: Variant = _parent()'),
              ],
              'scripts/save_load_ui.gd': [
                  ('var can_start := victory != null and victory.has_method("stored_victory") and not victory.stored_victory().is_empty()', 'var can_start: bool = victory != null and victory.has_method("stored_victory") and not victory.stored_victory().is_empty()'),
              ],
              'scripts/empire_progression_ui.gd': [
                  ('var goal_done := goals.completed_count() if goals != null and goals.has_method("completed_count") else 0', 'var goal_done: int = int(goals.completed_count()) if goals != null and goals.has_method("completed_count") else 0'),
                  ('var goal_total := goals.goals.size() if goals != null else 0', 'var goal_total: int = int(goals.goals.size()) if goals != null else 0'),
                  ('var milestone_done := progression.claimed.size() if progression != null else 0', 'var milestone_done: int = int(progression.claimed.size()) if progression != null else 0'),
                  ('var milestone_total := progression.milestones.size() if progression != null else 0', 'var milestone_total: int = int(progression.milestones.size()) if progression != null else 0'),
              ],
              'scripts/premium_ui_skin.gd': [
                  ('var tint := accents[i]', 'var tint: Color = accents[i]'),
              ],
              'scripts/bankruptcy_system.gd': [
                  ('return get_node_or_null("/root/Game")', 'var tree := get_tree()\n    if tree != null and tree.current_scene != null:\n        return tree.current_scene\n    return get_node_or_null("/root/Renew")'),
              ],
              'scripts/portfolio_ui.gd': [
                  ('list_label = _label("", 12, TEXT); list_label.size_flags_horizontal = Control.SIZE_EXPAND_FILL; list_label.custom_minimum_size = Vector2(0, 180); scroll.add_child(list_label)', 'list_label = _label("", 12, TEXT); list_label.size_flags_horizontal = Control.SIZE_EXPAND_FILL; list_label.custom_minimum_size = Vector2(0, 180); panel.remove_child(list_label); scroll.add_child(list_label)'),
              ],
              'scripts/corporations_ui.gd': [
                  ('list_label = _label("", 12, TEXT); list_label.size_flags_horizontal = Control.SIZE_EXPAND_FILL; list_label.custom_minimum_size = Vector2(0, 180); scroll.add_child(list_label)', 'list_label = _label("", 12, TEXT); list_label.size_flags_horizontal = Control.SIZE_EXPAND_FILL; list_label.custom_minimum_size = Vector2(0, 180); panel.remove_child(list_label); scroll.add_child(list_label)'),
              ],
          }

          for path, pairs in replacements.items():
              def f(s, pairs=pairs):
                  for a,b in pairs:
                      s = s.replace(a,b)
                  return s
              edit(path, f)

          # main.gd used compressed one-line property declarations. Expand them into
          # valid Godot 4.7 property blocks without changing their behavior.
          def main_fix(s):
              out=[]
              pat = re.compile(r'^var (\\w+): ([^:]+): get: (.*?); set\\(value\\): (.*)$')
              for line in s.splitlines():
                  m=pat.match(line)
                  if not m:
                      m2=re.match(r'^var (\\w+): get: (.*)$', line)
                      if m2:
                          out.append(f'var {m2.group(1)}: Variant:')
                          out.append(f'    get: {m2.group(2)}')
                          continue
                      out.append(line)
                      continue
                  name, typ, getter, setter = m.groups()
                  out.append(f'var {name}: {typ}:')
                  out.append(f'    get: {getter}')
                  out.append(f'    set(value): {setter}')
              return '\\n'.join(out)+'\\n' if s.endswith('\\n') else '\\n'.join(out)
          edit('scripts/main.gd', main_fix)
          PY

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          wget -q --tries=5 --waitretry=3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          mkdir -p "$HOME/godot"
          7z x /tmp/godot.zip -o"$HOME/godot" >/dev/null
          chmod +x "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" --version

      - name: Compile and import project
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --editor --path . --quit

      - name: Run core test suite
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --script res://tests/test_runner.gd

      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts .github/workflows/repair-batch.yml
          if git diff --cached --quiet; then
            echo "No source changes were necessary."
          else
            git commit -m "fix: complete production runtime repair pass"
            git push origin HEAD:main
          fi

      - name: Remove one-pass repair runner
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-batch.yml
          git commit -m "ci: remove one-pass repair runner"
          git push origin HEAD:main
