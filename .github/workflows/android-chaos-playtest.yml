name: RENEW Android Chaos Playtest

on:
  workflow_dispatch:
    inputs:
      steps:
        description: Number of hostile gameplay actions
        required: false
        default: '500'
      seed:
        description: Deterministic random seed
        required: false
        default: '20260912'
  push:
    branches: [main]
    paths:
      - 'scenes/**'
      - 'scripts/**'
      - 'Assets/**'
      - 'data/**'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'tools/chaos_playtest.py'
      - 'tools/sanitize_android_playtest.py'
      - 'tools/ci_android_install.py'
      - '.github/workflows/android-chaos-playtest.yml'

permissions:
  contents: read

concurrency:
  group: renew-android-chaos-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  PACKAGE_NAME: com.eghosa.renew

jobs:
  android-chaos-playtest:
    name: destructive-gameplay-bot
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate chaos bot
        run: |
          python -m py_compile tools/chaos_playtest.py tools/sanitize_android_playtest.py tools/ci_android_install.py
          python tools/chaos_playtest.py --help >/dev/null
          python tools/sanitize_android_playtest.py --help >/dev/null

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable KVM acceleration when available
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Install Android dependencies
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "emulator" \
            "system-images;android-34;google_apis;x86_64" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true

      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          chmod +x Godot_v${GODOT_VERSION}-stable_linux.x86_64
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q -j Godot_v${GODOT_VERSION}-stable_export_templates.tpz 'templates/*' -d "$templates"
          printf '%s\n' "${GODOT_VERSION}.stable" > "$templates/version.txt"

      - name: Import project
        run: timeout 180s ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Run release smoke gate
        run: timeout 300s ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --script res://tests/test_release_smoke.gd

      - name: Build emulator QA APK
        shell: bash
        run: |
          set -euo pipefail
          cp export_presets.cfg /tmp/export_presets.cfg.original
          restore_preset() { mv -f /tmp/export_presets.cfg.original export_presets.cfg 2>/dev/null || true; }
          trap restore_preset EXIT
          python - <<'PY'
          from pathlib import Path
          p = Path('export_presets.cfg')
          s = p.read_text()
          s = s.replace('architectures/arm64-v8a=true', 'architectures/arm64-v8a=false', 1)
          s = s.replace('architectures/x86_64=false', 'architectures/x86_64=true', 1)
          p.write_text(s)
          PY
          mkdir -p build
          timeout 600s ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --export-debug "Android" build/RENEW-chaos.apk
          restore_preset
          trap - EXIT
          test -s build/RENEW-chaos.apk
          git diff --exit-code -- export_presets.cfg

      - name: Run destructive gameplay bot
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6G
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none -no-metrics
          script: python tools/ci_android_install.py --apk build/RENEW-chaos.apk --package ${PACKAGE_NAME} --out build/chaos-playtest && (python tools/chaos_playtest.py --apk build/RENEW-chaos.apk --package ${PACKAGE_NAME} --out build/chaos-playtest --steps ${{ github.event.inputs.steps || '500' }} --seed ${{ github.event.inputs.seed || '20260912' }} --checkpoint-every 25 || true) && python tools/sanitize_android_playtest.py --mode chaos --out build/chaos-playtest --threshold high

      - name: Add chaos report to summary
        if: always()
        run: |
          if [ -f build/chaos-playtest/report.md ]; then
            cat build/chaos-playtest/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '# RENEW Android Chaos Playtest' >> "$GITHUB_STEP_SUMMARY"
            echo 'Chaos report was not produced. Inspect job logs.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload chaos evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RENEW-Android-Chaos-${{ github.run_number }}
          path: |
            build/chaos-playtest/
            build/RENEW-chaos.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Verify tracked source stayed clean
        if: always()
        run: git diff --exit-code -- .
