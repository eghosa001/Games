name: Full production repair

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  REPAIR_VERSION: 'full-2026-09-09'

jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, 'fix: full production repair') }}
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: '4.7.2'
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply complete repair set
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          def edit(path, fn):
              p=Path(path); s=p.read_text(encoding='utf-8'); n=fn(s)
              if n!=s: p.write_text(n,encoding='utf-8'); print('UPDATED',path)
          def replace(path,pairs):
              edit(path,lambda s: __import__('functools').reduce(lambda x,p:x.replace(*p),pairs,s))
          def normalize(s):
              out=[]; pat=re.compile(r'^var (\\w+(?:: [^:]+)?): get: (.*?); set\\(value\\): (.*)$')
              for line in s.splitlines():
                  m=pat.match(line)
                  if not m: out.append(line); continue
                  left,getter,setter=m.groups(); out += [f'var {left}:','    get:',f'        {getter}','    set(value):',f'        {setter}']
              return '\n'.join(out)+ ('\n' if s.endswith('\n') else '')
          edit('scripts/main.gd',normalize)
          replace('scripts/alliance_ui.gd',[('var partner_y := y + ceil(float(buttons.size()) / float(cols)) * 50 + 4','var partner_y: float = y + ceil(float(buttons.size()) / float(cols)) * 50 + 4')])
          replace('scripts/headquarters_ui.gd',[('var stage_index := system.get_stage_index()','var stage_index: int = int(system.get_stage_index())'),('var built := system.has_area(selected_area)','var built: bool = bool(system.has_area(selected_area))'),('var level := system.area_level(selected_area)','var level: int = int(system.area_level(selected_area))'),('var unlocked := stage_index >= int(spec.get("min_stage", 0))','var unlocked: bool = stage_index >= int(spec.get("min_stage", 0))')])
          replace('scripts/infrastructure_ui.gd',[('var game := _parent()','var game: Variant = _parent()')])
          replace('scripts/save_load_ui.gd',[('var can_start := victory != null and victory.has_method("stored_victory") and not victory.stored_victory().is_empty()','var can_start: bool = victory != null and victory.has_method("stored_victory") and not victory.stored_victory().is_empty()')])
          replace('scripts/empire_progression_ui.gd',[('var goal_done := goals.completed_count() if goals != null and goals.has_method("completed_count") else 0','var goal_done: int = int(goals.completed_count()) if goals != null and goals.has_method("completed_count") else 0'),('var goal_total := goals.goals.size() if goals != null else 0','var goal_total: int = int(goals.goals.size()) if goals != null else 0'),('var milestone_done := progression.claimed.size() if progression != null else 0','var milestone_done: int = int(progression.claimed.size()) if progression != null else 0'),('var milestone_total := progression.milestones.size() if progression != null else 0','var milestone_total: int = int(progression.milestones.size()) if progression != null else 0')])
          replace('scripts/premium_ui_skin.gd',[('var tint := accents[i]','var tint: Color = accents[i]')])
          replace('scripts/bankruptcy_system.gd',[('return get_node_or_null("/root/Game")','var root_game := get_node_or_null("/root/Renew")\n    if root_game != null:\n        return root_game\n    var tree := get_tree()\n    if tree != null and tree.current_scene != null and tree.current_scene.has_method("advance_day"):\n        return tree.current_scene\n    return null')])
          replace('scripts/contracts_ui.gd',[('reputation = int(game_state.reputation)','reputation = int(game_state.get_value("player", "reputation", 0))')])
          replace('tests/test_runner.gd',[('    root.add_child(game)\n    await process_frame','    game.name = "Renew"\n    root.add_child(game)\n    await process_frame'),('    game.free()\n    await process_frame','    game.queue_free()\n    await process_frame')])
          PY
      - name: Install Godot
        run: |
          set -euo pipefail
          wget -q --tries=5 --waitretry=3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          mkdir -p "$HOME/godot"; 7z x /tmp/godot.zip -o"$HOME/godot" >/dev/null; chmod +x "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
      - name: Compile project
        run: timeout 180s "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --editor --path . --quit
      - name: Run integration suite
        run: timeout 300s "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --script res://tests/test_runner.gd
      - name: Commit repaired source onto latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts tests
          git commit -m 'fix: full production repair' || true
          for i in 1 2 3 4 5; do git fetch origin main; git rebase origin/main && git push origin HEAD:main && exit 0; git rebase --abort || true; sleep 2; done
          exit 1
