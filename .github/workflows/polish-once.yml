name: RENEW Final Production Polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix mobile layout geometry
        run: |
          python3 -c 'from pathlib import Path; p=Path("scripts/mobile_ui.gd"); s=p.read_text(); s=s.replace("var last_seen_day := 1\\n", "var last_seen_day := 1\\nvar top_bar: ColorRect\\nvar bottom_bar: ColorRect\\n"); s=s.replace("parent = get_parent(); _build_ui(); _refresh()", "parent = get_parent(); _build_ui(); _apply_polished_theme(); _refresh()"); s=s.replace("var top := ColorRect.new(); top.name = \"TopBar\"; top.color = Color(\"101820\"); top.set_anchors_preset(Control.PRESET_TOP_WIDE); top.position.y = 8; top.size.y = 54; top.mouse_filter = Control.MOUSE_FILTER_IGNORE; root.add_child(top)", "top_bar = ColorRect.new(); top_bar.name = \"TopBar\"; top_bar.color = Color(\"101820\"); top_bar.position = Vector2(0, 8); top_bar.size = Vector2(1280, 54); top_bar.mouse_filter = Control.MOUSE_FILTER_IGNORE; root.add_child(top_bar)"); s=s.replace("var bottom := ColorRect.new(); bottom.color = Color(\"101820\"); bottom.set_anchors_preset(Control.PRESET_BOTTOM_WIDE); bottom.position.y = -150; bottom.size.y = 150; bottom.mouse_filter = Control.MOUSE_FILTER_IGNORE; root.add_child(bottom)", "bottom_bar = ColorRect.new(); bottom_bar.color = Color(\"101820\"); bottom_bar.position = Vector2(0, 570); bottom_bar.size = Vector2(1280, 150); bottom_bar.mouse_filter = Control.MOUSE_FILTER_IGNORE; root.add_child(bottom_bar)"); s=s.replace("action_scroll = ScrollContainer.new(); action_scroll.set_anchors_preset(Control.PRESET_TOP_WIDE); action_scroll.position = Vector2(18, 72); action_scroll.size = Vector2(1240, 160);", "action_scroll = ScrollContainer.new(); action_scroll.position = Vector2(18, 72); action_scroll.size = Vector2(1240, 160);"); s=s.replace("    var narrow := w < 700.0", "    var h := maxf(root.size.y, 480.0)\\n    if top_bar != null: top_bar.size = Vector2(w, 54.0)\\n    if bottom_bar != null: bottom_bar.position = Vector2(0, maxf(0.0, h - 150.0)); bottom_bar.size = Vector2(w, 150.0)\\n    var narrow := w < 700.0"); marker="func _layout_responsive() -> void:\\n"; theme="func _apply_polished_theme() -> void:\\n    var theme := Theme.new()\\n    theme.default_font_size = 14\\n    var normal := StyleBoxFlat.new()\\n    normal.bg_color = Color(\"1b2b31\")\\n    normal.border_color = Color(\"385158\")\\n    normal.set_border_width_all(1)\\n    normal.set_corner_radius_all(8)\\n    var hover := normal.duplicate()\\n    hover.bg_color = Color(\"274047\")\\n    hover.border_color = Color(\"6d9d91\")\\n    var pressed := hover.duplicate()\\n    pressed.bg_color = Color(\"315b5c\")\\n    theme.set_stylebox(\"normal\", \"Button\", normal)\\n    theme.set_stylebox(\"hover\", \"Button\", hover)\\n    theme.set_stylebox(\"pressed\", \"Button\", pressed)\\n    theme.set_color(\"font_color\", \"Button\", Color(\"d9e6e7\"))\\n    theme.set_color(\"font_hover_color\", \"Button\", Color(\"ffffff\"))\\n    theme.set_color(\"font_pressed_color\", \"Button\", Color(\"ffffff\"))\\n    for child in tabs.get_children():\\n        if child is Button: child.theme = theme\\n\\n"; s=s if "func _apply_polished_theme()" in s else s.replace(marker, theme+marker); p.write_text(s)'
      - name: Add release readiness document
        run: |
          cat > Docs/PRODUCTION_READINESS.md <<'EOF'
          # RENEW Production Readiness

          The production-polish pass focuses on presentation and device readiness while preserving the tested simulation contracts.

          - Responsive mobile controls use explicit geometry and avoid anchor/size conflicts.
          - Touch controls use consistent hit targets and clear visual states.
          - The world view communicates restoration, business health, regional expansion and supply flow.
          - Goals, milestones and daily reports make the economic loop understandable.
          - The existing economy, rivals, alliances, resources, branches, regions and corporate systems remain regression-gated.

          ## Release QA
          - Test 320/360/480px phones and tablets.
          - Profile low-end Android frame time and memory.
          - Add authored art/audio without changing simulation APIs.
          - Tune prices, margins and expansion pacing through human playtests.
          - Package Android and complete store metadata.
          EOF
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/polish-once.yml
          git add scripts/mobile_ui.gd Docs/PRODUCTION_READINESS.md .github/workflows/polish-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore: finalize production polish"
          git push
