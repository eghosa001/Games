name: RENEW Godot 4.7 Source Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'Apply Godot 4.7 source repairs'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply source repairs
        run: python3 tools/repair_godot47.py
      - name: Commit repaired source
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts tools
            git commit -m "Apply Godot 4.7 source repairs"
            git push
          fi
