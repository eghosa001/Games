name: RENEW Android Export

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'project.godot'
      - 'export_presets.cfg'
      - 'Assets/**'
      - 'scenes/**'
      - 'scripts/**'
      - '.github/workflows/android-export.yml'

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android build dependencies
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.1" "cmake;3.10.2.4988404" "ndk;28.1.13356709"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
      - name: Install Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Install matching Android export templates
        run: |
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates/templates"
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz -d "$templates"
          printf '%s\n' "${GODOT_VERSION}.stable" > "$templates/version.txt"
      - name: Import project
        run: timeout 120s ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Validate Android export configuration
        run: timeout 60s ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --script res://tests/test_android_release_config.gd
      - name: Export installable Android debug APK
        run: |
          mkdir -p build
          timeout 600s ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --export-debug "Android" build/RENEW-debug.apk
          test -s build/RENEW-debug.apk
          file build/RENEW-debug.apk
          ls -lh build/RENEW-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RENEW-Android-debug
          path: build/RENEW-debug.apk
          if-no-files-found: error
          retention-days: 14
