name: RENEW Android Export

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: renew-android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  ANDROID_CMDLINE_TOOLS: 15859902

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install current Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-$HOME/android-sdk}"
          mkdir -p "$sdk_root/cmdline-tools"
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CMDLINE_TOOLS}_latest.zip" -O /tmp/android-cmdline-tools.zip
          rm -rf /tmp/android-cmdline-tools
          mkdir -p /tmp/android-cmdline-tools
          unzip -q /tmp/android-cmdline-tools.zip -d /tmp/android-cmdline-tools
          rm -rf "$sdk_root/cmdline-tools/latest"
          mv /tmp/android-cmdline-tools/cmdline-tools "$sdk_root/cmdline-tools/latest"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" --version
          yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" --licenses >/dev/null || true
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"
          test -x "$sdk_root/platform-tools/adb"
          test -d "$sdk_root/platforms/android-36"
          test -d "$sdk_root/build-tools/36.0.0"

      - name: Install Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          chmod +x Godot_v${GODOT_VERSION}-stable_linux.x86_64

      - name: Install matching Android export templates
        run: |
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q -j Godot_v${GODOT_VERSION}-stable_export_templates.tpz 'templates/*' -d "$templates"
          printf '%s\n' "${GODOT_VERSION}.stable" > "$templates/version.txt"
          test -s "$templates/android_source.zip"
          test -s "$templates/android_debug.apk"
          test -s "$templates/android_release.apk"

      - name: Install Android Gradle build template
        run: |
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          rm -rf android/build
          mkdir -p android/build
          unzip -q "$templates/android_source.zip" -d android/build
          test -f android/build/build.gradle || test -f android/build/settings.gradle

      - name: Import project
        run: timeout 180s ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Validate Android export configuration
        run: timeout 120s ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --script res://tests/test_android_release_config.gd

      - name: Run release smoke gate
        run: timeout 300s ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --script res://tests/test_release_smoke.gd

      - name: Run full new-game-flow gate
        run: timeout 600s ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --script res://tests/release/test_full_new_game_flow.gd

      - name: Verify validation kept source clean
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- .; then
            echo "ERROR: Android validation modified tracked source files."
            git diff -- .
            exit 1
          fi

      - name: Export installable Android debug APK
        run: |
          mkdir -p build
          timeout 600s ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --export-debug "Android" build/Restora-debug.apk
          test -s build/Restora-debug.apk
          file build/Restora-debug.apk
          ls -lh build/Restora-debug.apk

      - name: Verify export kept source clean
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- .; then
            echo "ERROR: Android export modified tracked source files."
            git diff -- .
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Restora-Android-debug
          path: build/Restora-debug.apk
          if-no-files-found: error
          retention-days: 14
