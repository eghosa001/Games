name: RENEW Android Play Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: renew-android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2

jobs:
  signed-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 build dependencies
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.1.0" "cmake;3.22.1" "ndk;29.0.14206865"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true

      - name: Install Godot
        run: |
          wget -q --tries=5 --waitretry=3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --version

      - name: Install matching Android export templates
        run: |
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          wget -q --tries=5 --waitretry=3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O /tmp/templates.tpz
          unzip -q -j /tmp/templates.tpz 'templates/*' -d "$templates"
          printf '%s\n' "${GODOT_VERSION}.stable" > "$templates/version.txt"
          test -s "$templates/android_source.zip"
          test -s "$templates/android_release.apk"

      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_USER: ${{ secrets.ANDROID_RELEASE_KEYSTORE_USER }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo 'Missing ANDROID_RELEASE_KEYSTORE_BASE64'; exit 1; }
          test -n "$KEYSTORE_USER" || { echo 'Missing ANDROID_RELEASE_KEYSTORE_USER'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Missing ANDROID_RELEASE_KEYSTORE_PASSWORD'; exit 1; }
          mkdir -p .release-secrets
          printf '%s' "$KEYSTORE_B64" | base64 --decode > .release-secrets/renew-release.keystore
          test -s .release-secrets/renew-release.keystore

      - name: Import project
        run: timeout 180s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --editor --path . --quit

      - name: Validate release configuration
        run: timeout 120s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --script res://tests/test_android_release_config.gd

      - name: Run release smoke gate
        run: timeout 300s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --script res://tests/test_release_smoke.gd

      - name: Run full new-game-flow gate
        run: timeout 600s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --script res://tests/release/test_full_new_game_flow.gd

      - name: Install Gradle Android build template
        run: timeout 300s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --editor --path . --install-android-build-template --quit

      - name: Export signed release AAB
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/.release-secrets/renew-release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_RELEASE_KEYSTORE_USER }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p build
          timeout 1200s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --export-release "Android Release" build/RENEW-release.aab
          test -s build/RENEW-release.aab
          file build/RENEW-release.aab
          ls -lh build/RENEW-release.aab

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: RENEW-Android-Play-release
          path: build/RENEW-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        run: rm -rf .release-secrets
