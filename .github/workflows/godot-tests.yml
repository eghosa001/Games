name: RENEW Godot Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  test-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Godot dependencies
        run: sudo apt-get update && sudo apt-get install -y unzip wget xvfb

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          wget -q --tries=5 --waitretry=3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --version

      - name: Import project
        run: timeout 180s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --editor --path . --quit

      - name: Run master game-plan coverage gate
        run: timeout 900s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --script res://tests/test_master_game_plan_coverage.gd

      - name: Run mobile QA automation
        run: timeout 300s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --script res://tests/mobile_qa_test.gd

      - name: Run full fast suite
        shell: bash
        run: |
          set -euo pipefail
          for t in tests/test_*.gd tests/integration/test_*.gd tests/release/test_*.gd; do
            [ -f "$t" ] || continue
            case "$t" in
              *test_long_soak.gd|*test_extreme_soak.gd) continue ;;
            esac
            echo "===== $t ====="
            timeout 180s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --script "res://$t"
          done

      - name: Run strict visual quality gate under Xvfb
        run: timeout 600s xvfb-run -a "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --path . --script res://tests/test_quality_gate.gd

      - name: Verify tests did not modify tracked source
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- .; then
            echo "ERROR: validation modified tracked repository files."
            git diff -- .
            exit 1
          fi

      - name: Upload quality-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renew-quality-gate-evidence
          path: |
            artifacts/**
            test_artifacts/**
          if-no-files-found: ignore
          retention-days: 14

  test-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Godot dependencies
        run: sudo apt-get update && sudo apt-get install -y unzip wget

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          wget -q --tries=5 --waitretry=3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"

      - name: Import project
        run: timeout 180s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --editor --path . --quit

      - name: Run long-duration suites
        shell: bash
        run: |
          set -euo pipefail
          for t in tests/test_long_soak.gd tests/test_extreme_soak.gd tests/long_running/test_*.gd; do
            [ -f "$t" ] || continue
            echo "===== $t ====="
            timeout 1800s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --script "res://$t"
          done

      - name: Verify soak tests did not modify tracked source
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- .; then
            echo "ERROR: soak validation modified tracked repository files."
            git diff -- .
            exit 1
          fi
