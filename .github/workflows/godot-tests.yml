name: RENEW Godot Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2

jobs:
  test-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply service migration and final presentation repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          scripts=root/'scripts'
          removed=['RenewAutosave','RenewUIRegionCoordinator','RenewIdentitySystem','RenewReputationSystem','RenewAllianceControl','RenewDiplomacySystem','RenewDiplomacyAI','RenewDiplomacyEffects','RenewDiplomacyControl','RenewInfrastructureSystem','RenewCollectionSystem','RenewLiveOpsSystem','RenewHeadquartersSystem','RenewCorporateLegacy','RenewEmployeeSystem','RenewCompanyCultureSystem','RenewGlobalRankingSystem','RenewWorldEventSystem','RenewAnalyticsSystem','RenewCompetitorStateBridge','RenewCompetitorReactionSystem','RenewTechnologySystem','RenewResearchSystem','RenewProgressionSystem','RenewRegionSystem','RenewDynamicEventController','RenewSeasonalRestorationSystem','RenewHistorySystem','RenewHistoryEventBridge','RenewNewsSystem','RenewAmbientAudio']
          for p in scripts.rglob('*.gd'):
              if p.name=='renew_services.gd': continue
              s=p.read_text(encoding='utf-8'); n=s
              for name in removed:
                  n=re.sub(r'(?<![A-Za-z0-9_])'+re.escape(name)+r'(?![A-Za-z0-9_])','RenewServices.get_service("'+name+'")',n)
              if n!=s: p.write_text(n,encoding='utf-8'); print('MIGRATED',p)
          # Repair known root typo and eliminate premium skin frame animation.
          p=scripts/'premium_ui_skin.gd'; s=p.read_text(encoding='utf-8')
          s=s.replace('get_node_or_null("/root/Ren/UI/MainHUD")','get_node_or_null("/root/Renew/UI/MainHUD")')
          s=s.replace('var pulse := 0.0\n','')
          s=re.sub(r'func _process\(delta: float\) -> void:\n    pulse \+= delta\n    if size != viewport_size:\n        viewport_size = size\n    queue_redraw\(\)\n','func _process(_delta: float) -> void:\n    if size != viewport_size:\n        viewport_size = size\n        queue_redraw()\n',s)
          s=s.replace('var alpha := 0.42 + 0.28 * sin(pulse * 1.7 + i * 1.8)','var alpha := 0.58')
          p.write_text(s,encoding='utf-8')
          # Make secondary UI screens inert and remove the duplicate rich backdrop node.
          p=root/'scenes/Main.tscn'; s=p.read_text(encoding='utf-8')
          s=re.sub(r'\[node name="RichWorldScenery" type="Node2D" parent="World"\]\nz_index=-25\nscript=ExtResource\("42"\)\n','',s)
          names=['TechnologyPanel','HistoryPanel','NewsPanel','AlliancePanel','HeadquartersPanel','CollectionPanel','LiveOpsPanel','CustomerSegmentsUI','RenewDiplomacyUI','InfrastructurePanel','ContractPanel','EmployeePanel','DashboardPanel','FinancePanel','PortfolioPanel','CorporationsPanel','RegionsPanel','WorldOpportunitiesPanel','ProductionControlPanel','SupplyChainPanel','EmpireExpansionPanel','EmpireIntelligencePanel','SaveLoadPanel']
          for name in names:
              s=re.sub(r'(\[node name="'+re.escape(name)+r'"[^\n]*\n)',r'\1process_mode=4\n',s,count=1)
          p.write_text(s,encoding='utf-8')
          # Remove timer-driven backdrop loops.
          p=scripts/'premium_world_backdrop.gd'; s=p.read_text(encoding='utf-8')
          s=re.sub(r'var _time := 0\.0\n','',s)
          s=re.sub(r'func _process\(delta: float\) -> void:\n(?:    .*\n)+?\nfunc _draw','func _draw',s)
          s=s.replace('    process_mode = Node.PROCESS_MODE_ALWAYS\n','')
          s=s.replace('var p := fmod(_time * (0.028 + i * 0.004) + float(i) * 0.14, 1.0)','var p := float(i) / 7.0')
          p.write_text(s,encoding='utf-8')
          p=scripts/'rich_world_scenery.gd'
          if p.exists():
              s=p.read_text(encoding='utf-8'); s=re.sub(r'func _process\([^\n]*\) -> void:\n(?:    .*\n)+?\n','',s); p.write_text(s,encoding='utf-8')
          # Cache authoritative state/finance references in Main.
          p=scripts/'main.gd'; s=p.read_text(encoding='utf-8')
          if 'var _game_state_ref: Node = null' not in s:
              s=s.replace('var command_system: GameplayCommandSystem\n','var command_system: GameplayCommandSystem\nvar _game_state_ref: Node = null\nvar _finance_ref: Node = null\n')
          s=s.replace('func _game_state(): return get_node_or_null("/root/RenewGameState")\nfunc _finance(): return get_node_or_null("/root/RenewFinanceSystem")\n','func _game_state(): return _game_state_ref\nfunc _finance(): return _finance_ref\n')
          if '_game_state_ref = get_node_or_null("/root/RenewGameState")' not in s:
              s=s.replace('func _ready():\n','func _ready():\n    _game_state_ref = get_node_or_null("/root/RenewGameState")\n    _finance_ref = get_node_or_null("/root/RenewFinanceSystem")\n')
          p.write_text(s,encoding='utf-8')
          # Android networking for analytics/liveops and remove deprecated Gradle toggle.
          p=root/'export_presets.cfg'; s=p.read_text(encoding='utf-8')
          s=s.replace('permissions/internet=false','permissions/internet=true').replace('permissions/access_network_state=false','permissions/access_network_state=true').replace('permissions/access_wifi_state=false','permissions/access_wifi_state=true').replace('gradle_build/use_gradle_build=false\n','')
          if 'exclude_filter=""' in s: s=s.replace('exclude_filter=""','exclude_filter="full_source_code.txt"')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Install Godot dependencies
        run: sudo apt-get update && sudo apt-get install -y unzip wget
      - name: Install Godot
        run: |
          set -euo pipefail
          wget -q --tries=5 --waitretry=3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --version
      - name: Import project
        run: timeout 120s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --editor --path . --quit
      - name: Run master game-plan coverage gate
        run: timeout 900s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --script res://tests/test_master_game_plan_coverage.gd
      - name: Run mobile QA automation
        run: timeout 300s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --script res://tests/mobile_qa_test.gd
      - name: Run full fast suite (every test except soaks)
        run: |
          set -euo pipefail
          for t in tests/test_*.gd tests/integration/test_*.gd tests/release/test_*.gd; do
            [ -f "$t" ] || continue
            echo "===== $t ====="
            timeout 120s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --script "res://$t" || exit 1
          done
      - name: Commit complete repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: service migration"
          git push origin HEAD:main
