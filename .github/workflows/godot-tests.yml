name: RENEW Godot Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot dependencies
        run: sudo apt-get update && sudo apt-get install -y unzip wget
      - name: Install Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Import project
        run: timeout 60s ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Run architecture integrity smoke test
        run: timeout 60s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/test_architecture_integrity.gd
      - name: Run GameState architecture test
        run: timeout 60s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/test_game_state.gd
      - name: Run simulation architecture test
        run: timeout 60s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/test_simulation_architecture.gd
      - name: Run production system test
        run: timeout 60s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/test_production_system.gd
      - name: Run restoration mechanics test
        run: timeout 60s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/test_restoration_mechanics.gd
      - name: Run supply chain system test
        run: timeout 60s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/test_supply_chain_system.gd
      - name: Run new-game flow test
        run: timeout 60s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/test_new_game_flow.gd
      - name: Run regression tests
        run: timeout 60s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/test_runner.gd
      - name: Run release smoke test
        run: timeout 60s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/test_release_smoke.gd
