name: RENEW Godot Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2

jobs:
  test-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot dependencies
        run: sudo apt-get update && sudo apt-get install -y unzip wget
      - name: Install Godot
        run: |
          set -euo pipefail
          wget -q --tries=5 --waitretry=3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --version
      - name: Import project
        run: timeout 120s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --editor --path . --quit
      - name: Run strict Godot quality gate
        run: timeout 600s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --script res://tests/test_quality_gate.gd
      - name: Run mobile QA automation
        run: timeout 300s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --script res://tests/mobile_qa_test.gd
      - name: Run full fast suite (every test except soaks)
        run: |
          set -euo pipefail
          for t in tests/test_*.gd tests/integration/test_*.gd tests/release/test_*.gd; do
            case "$t" in
              tests/test_long_soak.gd|tests/test_extreme_soak.gd) continue;;
              # Strict quality gate needs a real renderer for its frame
              # checkpoint; it runs in browser QA, not headless CI.
              tests/test_quality_gate.gd) continue;;
            esac
            echo "=== $t ==="
            timeout 600s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --script "res://$t"
          done
      - name: Upload strict Godot visual diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renew-godot-quality-gate
          path: ~/.local/share/godot/app_userdata/RENEW/quality_gate/
          if-no-files-found: warn
          retention-days: 14

  test-slow:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot dependencies
        run: sudo apt-get update && sudo apt-get install -y unzip wget
      - name: Install Godot
        run: |
          set -euo pipefail
          wget -q --tries=5 --waitretry=3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --version
      - name: Import project
        run: timeout 120s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --editor --path . --quit
      - name: Run long-running balance suite
        run: timeout 1800s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --script res://tests/long_running/test_30_60_180_365_day_balance.gd
      - name: Run long soak suite
        run: timeout 1800s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --script res://tests/test_long_soak.gd
      - name: Run extreme soak suite
        run: timeout 3600s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --script res://tests/test_extreme_soak.gd
