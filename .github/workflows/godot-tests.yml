name: RENEW Godot Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      validation_mode:
        description: "Validation scope"
        required: true
        default: full
        type: choice
        options:
          - targeted
          - full

permissions:
  contents: read

concurrency:
  group: godot-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select CI scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          full=false
          reason="iterative change"

          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            full=true
            reason="main branch validation"
          elif [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.action }}" == "ready_for_review" ]]; then
            full=true
            reason="final PR validation"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.validation_mode }}" == "full" ]]; then
            full=true
            reason="manual full validation"
          fi

          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "CI mode: $reason (full=$full)"

          if [[ "$full" == "false" ]]; then
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              base="${{ github.event.pull_request.base.sha }}"
            elif [[ "${{ github.event_name }}" == "push" ]]; then
              base="${{ github.event.before }}"
            else
              base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
            fi

            git diff --name-only "$base" "$GITHUB_SHA" > changed_files.txt
            python3 ci/select_relevant_tests.py --changed-file-list changed_files.txt --output selected_tests.txt

            echo "### Targeted CI" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Only tests relevant to the changed files will run." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Changed files:** $(wc -l < changed_files.txt)" >> "$GITHUB_STEP_SUMMARY"
            echo "**Selected tests:** $(wc -l < selected_tests.txt)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            sed 's/^/- `/; s/$/`/' selected_tests.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Full CI" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Reason: $reason" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y unzip curl xvfb

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          godot_url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl --fail --location --retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 30 --max-time 300 "$godot_url" -o /tmp/godot.zip
          unzip -tq /tmp/godot.zip >/dev/null
          unzip -q /tmp/godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --version

      - name: Import project
        run: timeout 180s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --editor --path . --quit

      - name: Run targeted tests
        if: steps.scope.outputs.full != 'true'
        shell: bash
        run: |
          set -u
          mkdir -p test_artifacts/logs
          failures=0
          failed_tests=()

          if [[ ! -s selected_tests.txt ]]; then
            echo "No gameplay/runtime tests are relevant to this change."
            exit 0
          fi

          while IFS= read -r t; do
            [[ -n "$t" ]] || continue
            [[ -f "$t" ]] || continue

            echo "===== $t ====="
            log="test_artifacts/logs/$(echo "$t" | tr '/' '_' | sed 's/\.gd$/.log/')"
            set +e
            timeout 180s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --script "res://$t" 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            if [[ "$status" -ne 0 ]]; then
              failures=$((failures + 1))
              failed_tests+=("$t")
            fi
          done < selected_tests.txt

          if [[ "$failures" -ne 0 ]]; then
            printf 'Targeted-suite failures (%d):\n' "$failures"
            printf ' - %s\n' "${failed_tests[@]}"
            exit 1
          fi

      - name: Run full core suite
        if: steps.scope.outputs.full == 'true'
        shell: bash
        run: |
          set -u
          mkdir -p test_artifacts/logs
          failures=0
          failed_tests=()

          for t in tests/test_*.gd tests/integration/test_*.gd tests/release/test_*.gd; do
            [ -f "$t" ] || continue
            case "$t" in
              *test_long_soak.gd|*test_extreme_soak.gd|*test_exhaustive_ui_matrix.gd|*test_visual_ui_matrix.gd|*test_quality_gate.gd|*test_master_game_plan_coverage.gd) continue ;;
            esac

            echo "===== $t ====="
            log="test_artifacts/logs/$(echo "$t" | tr '/' '_' | sed 's/\.gd$/.log/')"
            set +e
            timeout 180s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --script "res://$t" 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -ne 0 ]; then
              failures=$((failures + 1))
              failed_tests+=("$t")
            fi
          done

          if [ "$failures" -ne 0 ]; then
            printf 'Core-suite failures (%d):\n' "$failures"
            printf ' - %s\n' "${failed_tests[@]}"
            exit 1
          fi

      - name: Run game-plan coverage gate
        if: steps.scope.outputs.full == 'true'
        run: timeout 300s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --script res://tests/test_master_game_plan_coverage.gd

      - name: Run mobile QA smoke test
        if: steps.scope.outputs.full == 'true'
        run: timeout 300s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --script res://tests/mobile_qa_test.gd

      - name: Run visual quality gate
        if: steps.scope.outputs.full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          timeout 600s xvfb-run -a "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --path . --script res://tests/test_quality_gate.gd 2>&1 | tee test_artifacts/logs/visual-quality-gate.log

      - name: Verify tests did not modify tracked source
        run: git diff --exit-code -- .

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: renew-test-logs
          path: test_artifacts/logs/**
          if-no-files-found: ignore
          retention-days: 7
