name: RENEW Godot Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renew-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  test-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot dependencies
        run: sudo apt-get update && sudo apt-get install -y unzip wget xvfb

      - name: Install Godot
        run: |
          set -euo pipefail
          wget -q --tries=5 --waitretry=3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --version

      - name: Import project
        run: timeout 120s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --editor --path . --quit

      - name: Run master game-plan coverage gate
        run: timeout 900s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --script res://tests/test_master_game_plan_coverage.gd

      - name: Run mobile QA automation
        run: timeout 300s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --script res://tests/mobile_qa_test.gd

      - name: Run full fast suite
        run: |
          set -euo pipefail
          for t in tests/test_*.gd tests/integration/test_*.gd tests/release/test_*.gd; do
            [ -f "$t" ] || continue
            echo "===== $t ====="
            timeout 180s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --script "res://$t"
          done

      - name: Verify validation did not modify tracked source
        run: |
          set -euo pipefail
          if ! git diff --exit-code; then
            echo "ERROR: validation modified tracked repository files. Tests and import steps must be read-only."
            exit 1
          fi

  test-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot dependencies
        run: sudo apt-get update && sudo apt-get install -y unzip wget

      - name: Install Godot
        run: |
          set -euo pipefail
          wget -q --tries=5 --waitretry=3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"

      - name: Import project
        run: timeout 120s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --editor --path . --quit

      - name: Run long-running suites
        run: |
          set -euo pipefail
          for t in tests/test_long_soak.gd tests/test_extreme_soak.gd tests/test_simulation_soak.gd; do
            [ -f "$t" ] || continue
            echo "===== $t ====="
            timeout 1200s "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --script "res://$t"
          done

      - name: Verify soak tests did not modify tracked source
        run: git diff --exit-code
