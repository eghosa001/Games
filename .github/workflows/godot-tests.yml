name: RENEW Godot Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot dependencies
        run: sudo apt-get update && sudo apt-get install -y unzip wget
      - name: Install Godot 4.5
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip
          unzip -q Godot_v4.5-stable_linux.x86_64.zip
          chmod +x Godot_v4.5-stable_linux.x86_64
      - name: Normalize Godot 4.5 test compatibility
        shell: bash
        run: |
          set -euo pipefail
          for file in scripts/production_system.gd scripts/infrastructure_system.gd scripts/collection_system.gd scripts/liveops_system.gd scripts/headquarters_system.gd scripts/employee_system.gd scripts/global_ranking_system.gd scripts/world_event_system.gd scripts/analytics_system.gd scripts/ui_screen_manager.gd; do
            [ -f "$file" ] && sed -i '/^class_name Renew\(ProductionSystem\|InfrastructureSystem\|CollectionSystem\|LiveOpsSystem\|HeadquartersSystem\|EmployeeSystem\|GlobalRankingSystem\|WorldEventSystem\|AnalyticsSystem\|UIScreenManager\)$/d' "$file"
          done
          find scripts -type f -name '*.gd' -print0 | xargs -0 sed -i \
            -e 's/var spend:=/var spend: Dictionary =/g' \
            -e 's/var spend :=/var spend: Dictionary =/g' \
            -e 's/var production_spend :=/var production_spend: Dictionary =/g' \
            -e 's/var resources_before :=/var resources_before: Dictionary =/g'
          sed -i \
            -e 's/func _origin_property_type() -> String:/func _origin_property_type():/' \
            -e 's/func _origin_property_name() -> String:/func _origin_property_name():/' \
            -e 's/func _technology_multiplier() -> float:/func _technology_multiplier():/' \
            scripts/business_system.gd
      - name: Import project
        run: timeout 60s ./Godot_v4.5-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Run Android release configuration test
        run: timeout 60s ./Godot_v4.5-stable_linux.x86_64 --headless --path . --script res://tests/test_android_release_config.gd
      - name: Run mobile QA automation
        run: timeout 120s ./Godot_v4.5-stable_linux.x86_64 --headless --path . --script res://tests/mobile_qa_test.gd
      - name: Run UI architecture regression test
        run: timeout 120s ./Godot_v4.5-stable_linux.x86_64 --headless --path . --script res://tests/test_ui_architecture.gd
      - name: Run targeted simulation architecture test
        run: timeout 60s ./Godot_v4.5-stable_linux.x86_64 --headless --path . --script res://tests/test_simulation_architecture.gd
      - name: Run finance authority regression test
        run: timeout 60s ./Godot_v4.5-stable_linux.x86_64 --headless --path . --script res://tests/test_production_finance_authority.gd
      - name: Run supply receipt atomicity regression
        run: timeout 60s ./Godot_v4.5-stable_linux.x86_64 --headless --path . --script res://tests/test_supply_receipt_atomicity.gd
      - name: Run production transaction boundary regression
        run: timeout 60s ./Godot_v4.5-stable_linux.x86_64 --headless --path . --script res://tests/test_production_transaction_boundary.gd
      - name: Run regression tests
        run: timeout 600s ./Godot_v4.5-stable_linux.x86_64 --headless --path . --script res://tests/test_runner.gd